name: sso-labpro

services:
  # ── Infrastructure ──────────────────────────────────────────────────

  postgres-primary:
    image: postgres:16-alpine
    container_name: sso-postgres-primary
    environment:
      POSTGRES_USER: ${POSTGRES_PRIMARY_USER:-sso}
      POSTGRES_PASSWORD: ${POSTGRES_PRIMARY_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_PRIMARY_DB:-sso_primary}
    ports:
      - "${POSTGRES_PRIMARY_PORT:-5432}:5432"
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_PRIMARY_USER:-sso} -d ${POSTGRES_PRIMARY_DB:-sso_primary}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres-local:
    image: postgres:16-alpine
    container_name: sso-postgres-local
    environment:
      POSTGRES_USER: ${POSTGRES_LOCAL_USER:-sso}
      POSTGRES_PASSWORD: ${POSTGRES_LOCAL_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_LOCAL_DB:-sso_local}
    ports:
      - "${POSTGRES_LOCAL_PORT:-5433}:5432"
    volumes:
      - postgres-local-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_LOCAL_USER:-sso} -d ${POSTGRES_LOCAL_DB:-sso_local}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: sso-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-sso}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Auth Provider ───────────────────────────────────────────────────

  auth-server:
    build:
      context: .
      dockerfile: auth-provider/server/Dockerfile
    container_name: sso-auth-server
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      AUTH_SERVER_HOST: 0.0.0.0
      AUTH_SERVER_PORT: ${AUTH_SERVER_PORT:-3000}
      AUTH_SERVER_COOKIE_NAME: ${AUTH_SERVER_COOKIE_NAME:-auth_sid}
      AUTH_SERVER_COOKIE_SECRET: ${AUTH_SERVER_COOKIE_SECRET:-change-me-cookie-signing-secret}
      AUTH_SERVER_PUBLIC_URL: ${AUTH_SERVER_PUBLIC_URL:-http://localhost:3000}
      AUTH_SERVER_INTERNAL_URL: ${AUTH_SERVER_INTERNAL_URL:-http://auth-server:3000}
      DATABASE_URL: postgresql://${POSTGRES_PRIMARY_USER:-sso}:${POSTGRES_PRIMARY_PASSWORD:-change-me}@postgres-primary:5432/${POSTGRES_PRIMARY_DB:-sso_primary}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-change-me-admin-password}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-change-me-demo-password}
      APP_A_CLIENT_ID: ${APP_A_CLIENT_ID:-app-a-client}
      APP_A_CLIENT_SECRET: ${APP_A_CLIENT_SECRET:-change-me-app-a-secret}
      APP_B_CLIENT_ID: ${APP_B_CLIENT_ID:-app-b-client}
      APP_B_CLIENT_SECRET: ${APP_B_CLIENT_SECRET:-change-me-app-b-secret}
    ports:
      - "${AUTH_SERVER_PORT:-3000}:3000"
    depends_on:
      postgres-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  control-panel:
    image: node:22-alpine
    container_name: sso-control-panel
    command: ["tail", "-f", "/dev/null"]
    ports:
      - "${CONTROL_PANEL_PORT:-3001}:3001"
    depends_on:
      - auth-server
    restart: unless-stopped

  sync-worker:
    image: node:22-alpine
    container_name: sso-sync-worker
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      postgres-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ── Relying Applications ────────────────────────────────────────────

  app-a:
    image: node:22-alpine
    container_name: sso-app-a
    command: ["tail", "-f", "/dev/null"]
    ports:
      - "${APP_A_PORT:-4001}:4001"
    depends_on:
      postgres-local:
        condition: service_healthy
      auth-server:
        condition: service_started
    restart: unless-stopped

  app-b:
    image: node:22-alpine
    container_name: sso-app-b
    command: ["tail", "-f", "/dev/null"]
    ports:
      - "${APP_B_PORT:-4002}:4002"
    depends_on:
      postgres-local:
        condition: service_healthy
      auth-server:
        condition: service_started
    restart: unless-stopped

# ── Volumes ────────────────────────────────────────────────────────────

volumes:
  postgres-primary-data:
  postgres-local-data:
  rabbitmq-data:
